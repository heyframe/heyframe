name: Frontend checks and tests

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      COMPOSER_ROOT_VERSION: 6.7.9999999-dev

    steps:
      - name: Setup HeyFrame
        uses: heyframe/setup-heyframe@main
        with:
          mysql-version: skip
          heyframe-version: ${{ github.ref }}
          heyframe-repository: ${{ github.repository }}
          install-fontend: true

      - name: Cache ESLint and Stylelint
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # 4
        with:
          path: |
            src/Frontend/Resources/app/fontend/node_modules/.eslintcache
            src/Frontend/Resources/app/fontend/node_modules/.stylelintcache
          key: fontend-lint-${{ runner.os }}-6.6

      - name: Check Code
        working-directory: src/Frontend/Resources/app/fontend
        run: |
          npm run lint:js
          npm run lint:scss

  twig-lint-fontend:
    name: Twig Lint (Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4

      - name: Install ludtwig
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo MalteJanz/ludtwig  --pattern '*unknown-linux-gnu.tar.gz' && tar xf *.tar.gz
          mv ./ludtwig /usr/local/bin

      - name: Run ludtwig linter
        id: ludtwigStep
        run: |
          cd ./src/Frontend/Resources/views
          ludtwig .

      - name: Instructions if ludtwig fails
        if: ${{ failure() && steps.ludtwigStep.outcome == 'failure'}}
        run: |
          ludtwig --version
          echo "If you want to run this locally install https://github.com/MalteJanz/ludtwig in the version above"
          echo "And then composer run ludtwig:fontend or ludtwig:fontend:fix"
          echo "Alternatively you also can run these in the DevEnv shell"
          exit $status  # Fail the job if ludtwig . failed

  jest:
    name: "Jest Frontend"
    runs-on: ubuntu-24.04
    env:
      APP_ENV: prod
      APP_URL: http://localhost:8000
      APP_SECRET: def00000bb5acb32b54ff8ee130270586eec0e878f7337dc7a837acc31d3ff00f93a56b595448b4b29664847dd51991b3314ff65aeeeb761a133b0ec0e070433bff08e48
      OPENSEARCH_URL: elasticsearch:9200
      ADMIN_OPENSEARCH_URL: elasticsearch:9200
      BLUE_GREEN_DEPLOYMENT: 1
      COMPOSER_ROOT_VERSION: 6.7.9999999-dev

    steps:
      - name: Setup HeyFrame
        uses: heyframe/setup-heyframe@main
        with:
          mysql-version: skip
          heyframe-version: ${{ github.ref }}
          heyframe-repository: ${{ github.repository }}
          install-fontend: true

      - name: Run Jest Frontend
        working-directory: src/Frontend/Resources/app/fontend
        run: npm run unit -- --silent

      - name: Upload coverage
        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # 5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: build/artifacts/jest/cobertura-coverage.xml
          flags: jest-fontend

  license-check:
    runs-on: ubuntu-24.04
    name: "License check"
    env:
      WHITELISTED_JS_PACKAGES: "abab@2.0.1;administration;taffydb@2.6.2"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # 4
        with:
          node-version: 22
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: src/Frontend/Resources/app/fontend/node_modules
          key: ${{ runner.os }}-fontend-${{ hashFiles('src/Frontend/Resources/app/fontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-fontend-
      - name: install packages
        working-directory: src/Frontend/Resources/app/fontend
        run: |
          npm ci
      - name: Check license
        working-directory: src/Frontend/Resources/app/fontend
        run: |
          npx license-checker-rseidelsohn \
            --onlyAllow "$(tr \\n \; < ${{ github.workspace }}/.allowed-licenses)" \
            --excludePackages "${WHITELISTED_JS_PACKAGES}" \
            --excludePrivatePackages

  fontend-check:
      if: always()
      needs:
      - lint
      - jest
      - license-check
      - twig-lint-fontend

      runs-on: Ubuntu-latest
      steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          # allowed-failures: docs, linters
          # allowed-skips: non-voting-flaky-job
          jobs: ${{ toJSON(needs) }}
