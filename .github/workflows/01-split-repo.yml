name: 'Split Repository'

on:
  push:
    branches:
      - '*'
    paths:
      - src/Administration/**/*
      - src/Core/**/*
      - src/Frontend/**/*
      - src/Elasticsearch/**/*
      - src/Uni/**/*

env:
  GITHUB_TOKEN: ${{ secrets.TOKEN }}

jobs:
  packages_split:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          -
            local_path: 'Administration'
            split_repository: 'administration'
          -
            local_path: 'Core'
            split_repository: 'core'
          -
            local_path: 'Frontend'
            split_repository: 'frontend'

          -
            local_path: 'Uni'
            split_repository: 'uni'
          -
            local_path: 'Uni/Resources/app/uni'
            split_repository: 'heyuni'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Git safe.directory (universal solution)
        run: git config --global --add safe.directory '*'

      - name: Split package
        uses: danharrin/monorepo-split-github-action@v2.3.0
        with:
          package_directory: 'src/${{ matrix.package.local_path }}'
          repository_organization: 'heyframe'
          repository_name: '${{ matrix.package.split_repository }}'
          branch: '${{ github.ref_name }}'
          user_name: "gxiaosong"
          user_email: "lyricsong47@gmail.com"
